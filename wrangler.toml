name = "linkedin-pinpoint-worker"
main = "src/index.js"
compatibility_date = "2024-12-28"

# D1 Database binding
[[d1_databases]]
binding = "DB" # Available in your worker as env.DB
database_name = "pinpoint-database"
database_id = "3037e22c-1f89-453c-8b5c-c84af52db65c" # Will be filled after creating the database

# Environment variables (secrets)
[vars]
# SECRET_KEY will be set via wrangler secret put command
# Do NOT put the actual secret key here
